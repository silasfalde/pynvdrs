[project]
name = "pynvdrs"
version = "0.0.1"
description = "Shared utilities for NVDRS-style projects (paths, text cleaning, annotation helpers, GPT wrapper)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.dependencies]
pandas = "*"
numpy = "*"

[project.optional-dependencies]
gpt = ["openai>=1.0.0"]
text = ["symspellpy>=0.6.0"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
